# --- Connessione a Oracle (vale solo con il profilo "oracle" attivo) ---

# Dove si trova il database: stessi dati della connessione di DBeaver (host, porta, service name)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1

# Con che utente si collega l'applicazione (l'utente "applicativo", non l'amministratore)
spring.datasource.username=${DB_USERNAME}

# La password NON si scrive qui: si legge da una variabile d'ambiente
spring.datasource.password=${DB_PASSWORD}

# Hibernate NON crea e NON modifica le tabelle: controlla solo che le Entity corrispondano a quelle vere
spring.jpa.hibernate.ddl-auto=validate

# La console H2 con Oracle non serve
spring.h2.console.enabled=false

# Con Oracle i dati ci sono già: data.sql non va eseguito
spring.sql.init.mode=never