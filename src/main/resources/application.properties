spring.application.name=cultivar

# Database H2 in memoria
spring.datasource.url=jdbc:h2:mem:cultivardb
spring.datasource.username=sa
spring.datasource.password=

# Console web per vedere il database dal browser
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

agrolab.base-url=https://api.agrolab.example

logging.file.name=logs/cultivar.log